name: Data Process Sync

on:
  repository_dispatch:
    types: [sync-event]
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Get NEXT_ROW Variable
        run: |
          PAYLOAD_ROW="${{ github.event.client_payload.next_row }}"
          if [ -n "$PAYLOAD_ROW" ]; then
            echo "NEXT_ROW=$PAYLOAD_ROW" >> $GITHUB_ENV
          else
            echo "NEXT_ROW=${{ vars.NEXT_ROW }}" >> $GITHUB_ENV
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          seleniumbase install chromedriver

      - name: Execute sync
        env:
          DATA_CSV_B64: ${{ secrets.DATA_CSV_B64 }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          NEXT_ROW: ${{ env.NEXT_ROW }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FORM_URL: https://signup.ticketmaster.fr/paris-la-defense-arena
        run: |
          python sync.py

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-debug
          path: |
            *.png
            *.html
          if-no-files-found: ignore
